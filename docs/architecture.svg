<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#0b0d12"/>
  <text x="440" y="34" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">NVR_Home — Kiến trúc</text>

  <!-- Cameras -->
  <g>
    <rect x="30" y="140" width="150" height="120" rx="12" fill="#14161d" stroke="#334155"/>
    <rect x="55" y="160" width="100" height="60" rx="8" fill="none" stroke="#4f7cff" stroke-width="2.5"/>
    <path d="M155 180 L175 172 V188 Z" fill="#4f7cff"/>
    <text x="105" y="245" fill="#94a3b8" font-size="12" text-anchor="middle">IP Cameras (RTSP)</text>
  </g>

  <!-- go2rtc -->
  <g>
    <rect x="240" y="120" width="150" height="160" rx="12" fill="#14161d" stroke="#334155"/>
    <text x="315" y="150" fill="#4f7cff" font-size="14" font-weight="600" text-anchor="middle">go2rtc</text>
    <text x="315" y="175" fill="#94a3b8" font-size="11" text-anchor="middle">restream RTSP</text>
    <text x="315" y="193" fill="#94a3b8" font-size="11" text-anchor="middle">WebRTC / MSE</text>
    <text x="315" y="211" fill="#94a3b8" font-size="11" text-anchor="middle">:1984 / :8554</text>
  </g>

  <!-- Backend -->
  <g>
    <rect x="450" y="70" width="180" height="260" rx="12" fill="#14161d" stroke="#334155"/>
    <text x="540" y="98" fill="#4f7cff" font-size="14" font-weight="600" text-anchor="middle">FastAPI Backend</text>
    <rect x="465" y="112" width="150" height="52" rx="8" fill="#1a1d26" stroke="#2b3040"/>
    <text x="540" y="133" fill="#e2e8f0" font-size="11" text-anchor="middle">Recorder (ffmpeg)</text>
    <text x="540" y="150" fill="#64748b" font-size="10" text-anchor="middle">MP4 10s · retention</text>
    <rect x="465" y="172" width="150" height="52" rx="8" fill="#1a1d26" stroke="#2b3040"/>
    <text x="540" y="193" fill="#e2e8f0" font-size="11" text-anchor="middle">Detector (YOLO ONNX)</text>
    <text x="540" y="210" fill="#64748b" font-size="10" text-anchor="middle">person/car/cat/dog</text>
    <rect x="465" y="232" width="150" height="52" rx="8" fill="#1a1d26" stroke="#2b3040"/>
    <text x="540" y="253" fill="#e2e8f0" font-size="11" text-anchor="middle">InsightFace</text>
    <text x="540" y="270" fill="#64748b" font-size="10" text-anchor="middle">người quen · người lạ</text>
    <rect x="465" y="292" width="150" height="30" rx="8" fill="#1a1d26" stroke="#2b3040"/>
    <text x="540" y="311" fill="#e2e8f0" font-size="11" text-anchor="middle">Notifier · Telegram</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="690" y="120" width="160" height="160" rx="12" fill="#14161d" stroke="#334155"/>
    <text x="770" y="150" fill="#4f7cff" font-size="14" font-weight="600" text-anchor="middle">React Web App</text>
    <text x="770" y="175" fill="#94a3b8" font-size="11" text-anchor="middle">Live · Timeline</text>
    <text x="770" y="193" fill="#94a3b8" font-size="11" text-anchor="middle">Events · Người quen</text>
    <text x="770" y="211" fill="#94a3b8" font-size="11" text-anchor="middle">Cài đặt · Dashboard</text>
    <text x="770" y="240" fill="#64748b" font-size="10" text-anchor="middle">trình duyệt / PWA</text>
  </g>

  <!-- Storage -->
  <g>
    <rect x="240" y="310" width="390" height="60" rx="12" fill="#14161d" stroke="#334155"/>
    <text x="435" y="336" fill="#e2e8f0" font-size="12" text-anchor="middle">SQLite (events) + Ổ NAS: recordings/ · snapshots/ · models/</text>
    <text x="435" y="355" fill="#64748b" font-size="10" text-anchor="middle">volume ./storage — nâng cấp app không mất dữ liệu</text>
  </g>

  <!-- arrows -->
  <line x1="180" y1="200" x2="238" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="180" x2="448" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="230" x2="448" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="160" x2="850" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)" transform="rotate(180 740 160)"/>
  <line x1="540" y1="330" x2="540" y2="308" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="770" y1="280" x2="640" y2="290" stroke="#4f7cff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="705" y="272" fill="#4f7cff" font-size="10">REST + WebSocket</text>
  <line x1="770" y1="160" x2="398" y2="145" stroke="#4f7cff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="580" y="128" fill="#4f7cff" font-size="10">stream MSE &lt;1–2s</text>
</svg>
